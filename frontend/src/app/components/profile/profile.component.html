<div class="profile-page">
  <div class="profile-container">
    <aside class="profile-sidebar">
      <div class="profile-sidebar-header">
        <mat-icon fontIcon="account_circle"></mat-icon>
        <h2>Profile</h2>
      </div>

      <nav class="profile-sidebar-nav">
        <button
          class="profile-sidebar-item"
          [class.profile-sidebar-item--active]="$activeTab() === 'info'"
          (click)="selectTab('info')">
          <mat-icon fontIcon="person"></mat-icon>
          <span>Information</span>
        </button>

        @if (isStudent()) {
          <button
            class="profile-sidebar-item"
            [class.profile-sidebar-item--active]="$activeTab() === 'grades'"
            (click)="selectTab('grades')">
            <mat-icon fontIcon="grade"></mat-icon>
            <span>Grades</span>
          </button>
        }

        <div class="profile-sidebar-divider"></div>

        <button
          class="profile-sidebar-item profile-sidebar-item--logout"
          (click)="logout()">
          <mat-icon fontIcon="logout"></mat-icon>
          <span>Logout</span>
        </button>
      </nav>
    </aside>

    <main class="profile-main">
      @switch ($activeTab()) {
        @case ('info') {
          <app-profile-info-tab></app-profile-info-tab>
        }
        @case ('grades') {
          <app-profile-grades-tab></app-profile-grades-tab>
        }
      }
    </main>
  </div>
</div>
